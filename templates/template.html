<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Task Tracking</title>
        <style>
            .description {
                font-size: 75%;
            }
        </style>
    </head>
    <body>
        <h1>Task Tracking</h1>
        {% for task in tasks %}
            <p>{{ task.name }}</p>
            <p>{{ task.description }}</p>
        {% endfor %}
    </body>
</html>
