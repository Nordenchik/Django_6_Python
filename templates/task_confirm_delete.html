{% extends "base.html" %}
{% block title %}Delete task{% endblock %}
{% block content %}
<h1 class="h4">Видалити “{{ task.name }}”?</h1>
<form method="post" class="mt-3">
    {% csrf_token %}
    <button class="btn btn-danger">Підтвердити видалення</button>
    <a class="btn btn-secondary" href="{% url 'tasks:task_detail' task.id %}">Скасувати</a>
</form>
{% endblock %}
